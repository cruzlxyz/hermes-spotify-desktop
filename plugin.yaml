name: spotify-desktop
version: 0.1.4
description: "Spotify remote for Hermes — a mini player in the desktop status bar (now playing, transport, devices, search, playlists, queue) reusing the Hermes Spotify login (official spotify plugin)."
author: "cruzlxyz"
kind: backend
requires_plugins:
  - id: spotify
config_schema:
  poll_interval_open:
    type: number
    default: 4
    description: "Seconds between playback polls while the popover is open."
  poll_interval_closed:
    type: number
    default: 12
    description: "Seconds between playback polls while the popover is closed."
